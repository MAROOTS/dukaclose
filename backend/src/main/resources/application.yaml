spring:
  application:
    name: duka-close-api
  datasource:
    url: jdbc:postgresql://localhost:5433/duka_close
    username: duka
    password: duka_dev_password
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true

server:
  port: 8080
  servlet:
    session:
      timeout: 12h
      cookie:
        http-only: true
        same-site: lax
        secure: false      # MUST be true in production (HTTPS)